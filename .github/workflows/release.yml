name: Publish release

on:
  push:
    branches:
      - main
    paths:
      - '.github/releases/**'
      - '.github/workflows/release.yml'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Publish the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if test -z "$RELEASE_TAG"; then
            RELEASE_TAG="v$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi
          notes=".github/releases/${RELEASE_TAG}.md"
          test -s "$notes"
          title="$(head -n 1 "$notes")"
          tail -n +3 "$notes" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "$title" --notes-file "$RUNNER_TEMP/release-notes.md"
